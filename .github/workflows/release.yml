name: Release
on:
  push:
    tags: ["*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scala Native and specs2-5 are Scala 3 only (crossScalaVersions pinned
      # to 3.x), and the Scala 3 compiler bridge requires a newer JDK than
      # Scala 2.12/2.13 need. A single `sbt` process can only run one JDK, so
      # the release is split into two JDK phases (mirroring scala.yml), using
      # sbt-ci-release's CI_RELEASE/CI_SONATYPE_RELEASE override hooks:
      # https://github.com/sbt/sbt-ci-release#customizing-the-release-process
      - name: Set up JDK 11 (Scala 2.12 / 2.13)
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'adopt'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish Scala 2.12 / 2.13 artifacts
        # Scope to the JVM/JS projects only, same as the scala_2_12/scala_2_13
        # jobs in scala.yml; Native/specs2-5 are handled in the JDK 17 phase.
        # CI_SONATYPE_RELEASE is a no-op here: the staging repo is only
        # closed/released once, after the Scala 3 artifacts are published too.
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          CI_SONATYPE_RELEASE: show version
          CI_RELEASE: >-
            ; ++2.12.21
            ; scalamockJVM/publishSigned ; scalamockJS/publishSigned
            ; scalamock-zioJVM/publishSigned ; scalamock-zioJS/publishSigned
            ; scalamock-cats-effectJVM/publishSigned ; scalamock-cats-effectJS/publishSigned
            ; scalamock-specs2-4JVM/publishSigned ; scalamock-specs2-4JS/publishSigned
            ; scalamock-scalatestJVM/publishSigned ; scalamock-scalatestJS/publishSigned
            ; ++2.13.18
            ; scalamockJVM/publishSigned ; scalamockJS/publishSigned
            ; scalamock-zioJVM/publishSigned ; scalamock-zioJS/publishSigned
            ; scalamock-cats-effectJVM/publishSigned ; scalamock-cats-effectJS/publishSigned
            ; scalamock-specs2-4JVM/publishSigned ; scalamock-specs2-4JS/publishSigned
            ; scalamock-scalatestJVM/publishSigned ; scalamock-scalatestJS/publishSigned

      - name: Set up JDK 17 (Scala 3)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'
          cache: sbt
      - name: Publish Scala 3 artifacts and release
        # No `++`/`+` override needed: 3.9.0 is already the default
        # scalaVersion, and this covers all platforms (JVM/JS/Native),
        # including the Scala-3-only specs2-5 module. CI_SONATYPE_RELEASE
        # falls back to the plugin default (sonaRelease), closing/releasing
        # the staging repo now that every artifact has been published.
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          CI_RELEASE: publishSigned
